version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ml_lab_user
      POSTGRES_PASSWORD: ml_lab_pass
      POSTGRES_DB: ml_virtual_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
